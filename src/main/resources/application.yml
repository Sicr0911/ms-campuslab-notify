server:
  port: 8083

spring:
  application:
    name: ms-campuslab-notify

  rabbitmq:
    host: ${RABBITMQ_HOST:54.234.173.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin_dev}
    listener:
      simple:
        # Ack/nack explicitos (ver ConsumidorConAck), en vez de que Spring
        # AMQP confirme automaticamente al terminar el metodo. Politica:
        #   - OK                         -> basicAck
        #   - error no recuperable       -> basicNack(requeue=false) -> DLQ
        #   - error recuperable, 1a vez  -> basicNack(requeue=true)  -> reintento
        #   - error recuperable, reentregado -> basicNack(requeue=false) -> DLQ
        # No se usa el retry de Spring (spring.rabbitmq.listener.simple.retry):
        # los reintentos los decide el propio consumidor con el flag redelivered.
        acknowledge-mode: manual
        # Procesa de a un mensaje por consumidor: un mensaje reencolado no
        # queda bloqueado detras de muchos otros sin confirmar.
        prefetch: 1

# Nombres de toda la topologia RabbitMQ de este servicio (ver
# NotifyRabbitProperties / RabbitMqConfig). Deben coincidir con lo que
# publica ms-campuslab-bookings (ReservaEventPublisher) y con
# infra/mq/definitions.json.
campuslab:
  rabbitmq:
    exchange: ${RABBITMQ_CMD_EXCHANGE:cmd.direct}
    # Alertas internas publicadas por ms-campuslab-catalog (CatalogEventPublisher:
    # cmd.topic / email.stock-agotado) que tambien se envian por email.
    topic-exchange:
      name: ${RABBITMQ_TOPIC_EXCHANGE:cmd.topic}
      email-routing-pattern: email.*
    dead-letter-exchange: ${RABBITMQ_DLX:cmd.dlx}
    queues:
      email:
        name: q.cmd.email
        routing-key: email.send
        dlq: q.cmd.email.dlq
      prep:
        name: q.cmd.prep
        routing-key: prep.ticket
        dlq: q.cmd.prep.dlq
      voucher:
        name: q.cmd.voucher
        routing-key: voucher.gen
        dlq: q.cmd.voucher.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.campuslab.notify: INFO
