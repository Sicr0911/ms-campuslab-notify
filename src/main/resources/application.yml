server:
  port: 8083

spring:
  application:
    name: ms-campuslab-notify

  rabbitmq:
    host: ${RABBITMQ_HOST:54.234.173.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin_dev}
    listener:
      simple:
        # Ack/nack explicitos en cada listener (ver EmailNotificationListener,
        # PreparationTicketListener, VoucherGenerationListener), en vez de
        # que Spring AMQP confirme automaticamente al terminar el metodo.
        acknowledge-mode: manual
        # Un mensaje que falla se reintenta unas pocas veces en este mismo
        # consumer antes de descartarse a la DLQ (via basicNack con
        # requeue=false en el catch de cada listener); retry aqui es sobre
        # errores de conexion/infra, no sobre la logica de negocio.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

# Nombres de toda la topologia RabbitMQ de este servicio (ver
# NotifyRabbitProperties / RabbitMqConfig). Deben coincidir con lo que
# publica ms-campuslab-bookings (ReservaEventPublisher) y con
# infra/mq/definitions.json.
campuslab:
  rabbitmq:
    exchange: ${RABBITMQ_CMD_EXCHANGE:cmd.direct}
    # Alertas internas publicadas por ms-campuslab-catalog (CatalogEventPublisher:
    # cmd.topic / email.stock-agotado) que tambien se envian por email.
    topic-exchange:
      name: ${RABBITMQ_TOPIC_EXCHANGE:cmd.topic}
      email-routing-pattern: email.*
    dead-letter-exchange: ${RABBITMQ_DLX:cmd.dlx}
    queues:
      email:
        name: q.cmd.email
        routing-key: email.send
        dlq: q.cmd.email.dlq
      prep:
        name: q.cmd.prep
        routing-key: prep.ticket
        dlq: q.cmd.prep.dlq
      voucher:
        name: q.cmd.voucher
        routing-key: voucher.gen
        dlq: q.cmd.voucher.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.campuslab.notify: INFO
